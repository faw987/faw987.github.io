<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Picture Grid</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  #dropZone {
    flex: 1 1 300px;
    min-height: 70px;
    border: 2px dashed #9ca3af;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    cursor: pointer;
    color: #4b5563;
    transition: background 0.15s, border-color 0.15s;
  }
  #dropZone.over { background: #e0f2fe; border-color: #0284c7; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  .controls label { display: flex; flex-direction: column; font-size: 12px; color: #4b5563; }
  .controls input { width: 90px; padding: 6px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 4px; }
  #status { font-size: 13px; color: #6b7280; }
  .buttons { display: flex; gap: 8px; }
  .buttons button {
    padding: 8px 14px; font-size: 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid #0284c7; background: #0284c7; color: #fff;
  }
  .buttons button:hover:not(:disabled) { background: #0369a1; }
  .buttons button:disabled { opacity: 0.45; cursor: not-allowed; }
  #info {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    background: #fff;
    min-height: 0;
  }
  #info[hidden], #grid[hidden] { display: none; }
  #info .wrap { max-width: 900px; margin: 0 auto; }
  #info img.portrait {
    float: right; max-width: 260px; max-height: 340px;
    margin: 0 0 12px 20px; border-radius: 6px; background: #1f2937;
  }
  #info h2 { margin-top: 0; }
  #info p { line-height: 1.6; font-size: 16px; }
  #info .source { clear: both; font-size: 13px; color: #6b7280; margin-top: 16px; }
  #selected {
    padding: 10px 16px;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    min-height: 48px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }
  #grid {
    flex: 1;
    display: grid;
    gap: 4px;
    padding: 4px;
    min-height: 0;
  }
  .cell {
    position: relative;
    background: #1f2937;
    overflow: hidden;
    cursor: pointer;
    border-radius: 4px;
    min-height: 0;
  }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;   /* show the whole picture, no cropping */
    display: block;
  }
  /* Selected picture: thick red border with a thin white inner ring for contrast */
  .cell.active::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 8px solid #dc2626;
    border-radius: 4px;
    box-shadow: inset 0 0 0 2px #fff;
    pointer-events: none;
  }
  .cell .broken {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #d1d5db; text-align: center; padding: 4px;
    word-break: break-all;
  }
</style>
</head>
<body>
<header>
  <div id="dropZone">
    Drop a CSV file here (or click to choose).<br />
    Each line: <code>name,url</code>
  </div>
  <input type="file" id="fileInput" accept=".csv,text/csv,text/plain" hidden />
  <div class="controls">
    <label>Rows <input type="number" id="rows" min="1" max="50" value="3" /></label>
    <label>Columns <input type="number" id="cols" min="1" max="50" value="4" /></label>
    <label>Seconds <input type="number" id="seconds" min="1" max="3600" value="5" /></label>
  </div>
  <div class="buttons">
    <button id="nextBtn" type="button" disabled>Next</button>
    <button id="infoBtn" type="button" disabled>More info</button>
  </div>
  <div id="status">No file loaded.</div>
</header>
<div id="selected">Click a picture to see who it is.</div>
<div id="grid"></div>
<div id="info" hidden></div>

<!-- TypeScript source: transpiled in the browser by the loader at the bottom -->
<script type="text/typescript" id="app">
interface Person {
  name: string;
  url: string;
}

const dropZone = document.getElementById("dropZone") as HTMLDivElement;
const fileInput = document.getElementById("fileInput") as HTMLInputElement;
const rowsInput = document.getElementById("rows") as HTMLInputElement;
const colsInput = document.getElementById("cols") as HTMLInputElement;
const secondsInput = document.getElementById("seconds") as HTMLInputElement;
const statusEl = document.getElementById("status") as HTMLDivElement;
const selectedEl = document.getElementById("selected") as HTMLDivElement;
const grid = document.getElementById("grid") as HTMLDivElement;
const infoEl = document.getElementById("info") as HTMLDivElement;
const nextBtn = document.getElementById("nextBtn") as HTMLButtonElement;
const infoBtn = document.getElementById("infoBtn") as HTMLButtonElement;

let people: Person[] = [];
let timer: number | undefined;
let selectedPerson: Person | null = null;
let showingInfo = false;
let infoRequest = 0; // increments to ignore stale Wikipedia responses

// ---------- CSV parsing ----------
function unquote(s: string): string {
  s = s.replace(/^\uFEFF/, "").trim();
  if (s.length >= 2 && s.startsWith('"') && s.endsWith('"')) {
    s = s.slice(1, -1).replace(/""/g, '"');
  }
  return s.trim();
}

/** Split a line into name and url at the first comma that is not inside quotes. */
function splitLine(line: string): [string, string] | null {
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') inQuotes = !inQuotes;
    else if (ch === "," && !inQuotes) {
      return [unquote(line.slice(0, i)), unquote(line.slice(i + 1))];
    }
  }
  return null;
}

function parseCsv(text: string): Person[] {
  const result: Person[] = [];
  const lines = text.split(/\r?\n/);
  lines.forEach((raw, idx) => {
    const line = raw.trim();
    if (!line) return;
    const parts = splitLine(line);
    if (!parts) return;
    const name = parts[0];
    let url = parts[1];
    if (!name || !url) return;
    // Fix scheme-less URLs such as "//host/path" or "host/path"
    if (url.startsWith("//")) url = "https:" + url;
    else if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
    // Skip a header row like "name,url"
    if (idx === 0 && /^(url|image|picture|photo|link)$/i.test(url)) return;
    result.push({ name, url });
  });
  return result;
}

// ---------- Random selection ----------
function shuffle<T>(arr: T[]): T[] {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Pick `count` people at random; unique when possible, repeats only if there aren't enough. */
function pickRandom(count: number): Person[] {
  if (people.length === 0) return [];
  const picked: Person[] = [];
  while (picked.length < count) {
    picked.push(...shuffle(people).slice(0, count - picked.length));
  }
  return picked;
}

// ---------- Rendering ----------
/**
 * Alternate URLs to try if the original fails. For Wikimedia thumbnails we try
 * the canonical upload.wikimedia.org host without tracking query parameters.
 */
function fallbackUrls(url: string): string[] {
  const out: string[] = [];
  try {
    const u = new URL(url);
    if (/(^|\.)wikimedia\.org$/i.test(u.hostname)) {
      const clean = `https://upload.wikimedia.org${u.pathname}`;
      if (clean !== url) out.push(clean);
    } else if (u.search) {
      out.push(`${u.origin}${u.pathname}`);
    }
  } catch { /* invalid URL: no fallbacks */ }
  return out;
}

function readInt(input: HTMLInputElement, fallback: number, min: number, max: number): number {
  const n = parseInt(input.value, 10);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function render(): void {
  const rows = readInt(rowsInput, 3, 1, 50);
  const cols = readInt(colsInput, 4, 1, 50);
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = "";
  // A new batch clears the previous selection
  selectedPerson = null;
  updateButtons();
  if (people.length) selectedEl.textContent = "Click a picture to see who it is.";

  const selection = pickRandom(rows * cols);
  for (let i = 0; i < rows * cols; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const person = selection[i];
    if (person) {
      const img = document.createElement("img");
      // Don't send a Referer header; some image hosts block hotlinked requests.
      img.referrerPolicy = "no-referrer";
      img.alt = person.name;
      img.loading = "eager";
      const fallbacks = fallbackUrls(person.url);
      img.onerror = () => {
        const next = fallbacks.shift();
        if (next) { img.src = next; return; }
        img.remove();
        const msg = document.createElement("div");
        msg.className = "broken";
        msg.textContent = `Image failed to load: ${person.url}`;
        cell.appendChild(msg);
        console.warn("Image failed:", person.name, person.url);
      };
      img.src = person.url;
      cell.appendChild(img);
      cell.addEventListener("click", () => {
        grid.querySelectorAll(".cell.active").forEach(c => c.classList.remove("active"));
        cell.classList.add("active");
        selectedEl.textContent = person.name;
        selectedPerson = person;
        updateButtons();
      });
    }
    grid.appendChild(cell);
  }
}

function updateButtons(): void {
  nextBtn.disabled = people.length === 0;
  infoBtn.disabled = !showingInfo && selectedPerson === null;
  infoBtn.textContent = showingInfo ? "Back to grid" : "More info";
}

function stopTimer(): void {
  if (timer !== undefined) window.clearInterval(timer);
  timer = undefined;
}

function restartTimer(): void {
  stopTimer();
  if (people.length === 0 || showingInfo) return;
  const seconds = readInt(secondsInput, 5, 1, 3600);
  timer = window.setInterval(render, seconds * 1000);
}

// ---------- Wikipedia "More info" ----------
interface WikiPage {
  title: string;
  extract?: string;
  fullurl?: string;
  missing?: boolean;
  pageprops?: { disambiguation?: string };
}

const WIKI_API = "https://en.wikipedia.org/w/api.php";

async function wikiQuery(params: Record<string, string>): Promise<WikiPage | null> {
  const qs = new URLSearchParams({
    action: "query",
    format: "json",
    formatversion: "2",
    origin: "*",            // required for anonymous cross-origin requests
    redirects: "1",
    prop: "extracts|info|pageprops",
    inprop: "url",
    exintro: "1",           // only the introductory section
    ...params,
  });
  const res = await fetch(`${WIKI_API}?${qs}`);
  if (!res.ok) throw new Error(`Wikipedia returned HTTP ${res.status}`);
  const data = await res.json();
  const page: WikiPage | undefined = data?.query?.pages?.[0];
  if (!page || page.missing || !page.extract) return null;
  return page;
}

/** Look up by exact title first; fall back to a search if missing or a disambiguation page. */
async function fetchWikiIntro(name: string): Promise<WikiPage | null> {
  const exact = await wikiQuery({ titles: name });
  if (exact && !exact.pageprops?.disambiguation) return exact;
  const searched = await wikiQuery({ generator: "search", gsrsearch: name, gsrlimit: "1" });
  return searched ?? exact;
}

/** Strip anything executable from the Wikipedia HTML before inserting it. */
function sanitize(html: string): DocumentFragment {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script, style, iframe, object, embed, link, meta").forEach(n => n.remove());
  doc.querySelectorAll("p.mw-empty-elt").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(el => {
    for (const attr of Array.from(el.attributes)) {
      if (attr.name.startsWith("on") || /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
    }
  });
  const frag = document.createDocumentFragment();
  Array.from(doc.body.childNodes).forEach(n => frag.appendChild(n));
  return frag;
}

async function showInfo(person: Person): Promise<void> {
  showingInfo = true;
  stopTimer();
  grid.hidden = true;
  infoEl.hidden = false;
  updateButtons();

  const reqId = ++infoRequest;
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  const img = document.createElement("img");
  img.className = "portrait";
  img.referrerPolicy = "no-referrer";
  img.alt = person.name;
  img.src = person.url;
  img.onerror = () => img.remove();
  const heading = document.createElement("h2");
  heading.textContent = person.name;
  const body = document.createElement("div");
  body.textContent = "Loading Wikipedia article…";
  wrap.append(img, heading, body);
  infoEl.replaceChildren(wrap);
  infoEl.scrollTop = 0;

  try {
    const page = await fetchWikiIntro(person.name);
    if (reqId !== infoRequest) return; // user moved on
    if (!page) {
      body.textContent = `No Wikipedia article found for "${person.name}".`;
      return;
    }
    if (page.title !== person.name) heading.textContent = page.title;
    body.replaceChildren(sanitize(page.extract ?? ""));
    const src = document.createElement("div");
    src.className = "source";
    const a = document.createElement("a");
    a.href = page.fullurl ?? `https://en.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "Read the full article on Wikipedia";
    src.append("Source: Wikipedia. ", a);
    wrap.appendChild(src);
  } catch (err) {
    if (reqId !== infoRequest) return;
    body.textContent = `Could not load Wikipedia article: ${(err as Error).message}`;
  }
}

function showGrid(newBatch: boolean): void {
  infoRequest++;
  showingInfo = false;
  infoEl.hidden = true;
  grid.hidden = false;
  if (newBatch) render();
  updateButtons();
  restartTimer();
}

nextBtn.addEventListener("click", () => showGrid(true));
infoBtn.addEventListener("click", () => {
  if (showingInfo) showGrid(false);
  else if (selectedPerson) showInfo(selectedPerson);
});

// ---------- File handling ----------
function loadFile(file: File): void {
  const reader = new FileReader();
  reader.onload = () => {
    people = parseCsv(String(reader.result ?? ""));
    statusEl.textContent = `Loaded "${file.name}": ${people.length} people.`;
    selectedEl.textContent = people.length
      ? "Click a picture to see who it is."
      : "No valid lines found (expected name,url).";
    showGrid(true);
    if (!people.length) selectedEl.textContent = "No valid lines found (expected name,url).";
  };
  reader.onerror = () => { statusEl.textContent = "Could not read file."; };
  reader.readAsText(file);
}

dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const f = fileInput.files?.[0];
  if (f) loadFile(f);
  fileInput.value = "";
});

["dragenter", "dragover"].forEach(evt =>
  dropZone.addEventListener(evt, e => {
    e.preventDefault();
    dropZone.classList.add("over");
  })
);
["dragleave", "drop"].forEach(evt =>
  dropZone.addEventListener(evt, e => {
    e.preventDefault();
    dropZone.classList.remove("over");
  })
);
dropZone.addEventListener("drop", e => {
  const f = (e as DragEvent).dataTransfer?.files?.[0];
  if (f) loadFile(f);
});
// Prevent the browser from opening files dropped outside the drop zone
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

rowsInput.addEventListener("change", () => showGrid(true));
colsInput.addEventListener("change", () => showGrid(true));
secondsInput.addEventListener("change", restartTimer);

render();
</script>

<script src="https://cdn.jsdelivr.net/npm/typescript@5/lib/typescript.js"></script>

</body>
</html>
